name: music_teleprompter
description: "Professional teleprompter for music performance — lyrics, chords, beat sync. Runs on macOS, Windows, Linux, iOS, Android, and Web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # macOS window management (fullscreen, title bar)
  window_manager: ^0.4.3

  # File picker (open/save script files)
  file_picker: ^8.1.2

  # Local storage paths
  path_provider: ^2.1.4

  # Persist settings
  shared_preferences: ^2.3.3

  # Audio playback for rehearsal mode
  just_audio: ^0.9.40

  # HTTP client for LRCLIB lyrics search
  http: ^1.2.0

  cupertino_icons: ^1.0.8

dependency_overrides:
  # path_provider_android 2.3+ pulls in jni_flutter which fails to compile on Windows.
  # Pin strictly below 2.3.0 which predates the JNI dependency.
  path_provider_android: '>=2.2.4 <2.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  image: ^4.1.0

flutter_launcher_icons:
  image_path: "assets/logo/logo.png"
  macos:
    generate: true
    image_path: "assets/logo/logo.png"
  windows:
    generate: true
    image_path: "assets/logo/logo.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/scripts/
    - assets/fonts/
    - assets/logo/

  fonts:
    - family: TeleprompterMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: TeleprompterInter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
    - family: TeleprompterOswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: TeleprompterSerif
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
